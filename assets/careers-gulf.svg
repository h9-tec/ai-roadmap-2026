<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="t">
<title id="t">Where AI-related roles sit in the Gulf market</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#141c2e"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2a3650" stroke-width="0.6" opacity="0.5"/></pattern>
</defs>
<rect width="1280" height="380" fill="url(#bg)"/>
<rect width="1280" height="380" fill="url(#grid)"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="64" y="56" font-size="26" fill="#f1f5f9" font-weight="700" text-anchor="start" >Where the Gulf&#x27;s AI roles sit</text>
<text x="64" y="84" font-size="14" fill="#7c889c" font-weight="400" text-anchor="start" >Share of AI-related roles in Saudi Arabia, the UAE, and Qatar, H1 2026 · per the market analysis this roadmap is built on</text>
<text x="362" y="140" font-size="16" fill="#f1f5f9" font-weight="600" text-anchor="end" >Implementing AI</text>
<rect x="380" y="118" width="760" height="32" rx="4" fill="#1baf7a" opacity="1"/>
<text x="1152.0" y="141" font-size="18" fill="#f1f5f9" font-weight="700" text-anchor="start" >35%</text>
<text x="362" y="196" font-size="16" fill="#b6c0d1" font-weight="400" text-anchor="end" >Using AI in daily work</text>
<rect x="380" y="174" width="673" height="32" rx="4" fill="#1baf7a" opacity="0.55"/>
<text x="1065.142857142857" y="197" font-size="18" fill="#f1f5f9" font-weight="700" text-anchor="start" >31%</text>
<text x="362" y="252" font-size="16" fill="#b6c0d1" font-weight="400" text-anchor="end" >Selling AI products and services</text>
<rect x="380" y="230" width="543" height="32" rx="4" fill="#1baf7a" opacity="0.55"/>
<text x="934.8571428571429" y="253" font-size="18" fill="#f1f5f9" font-weight="700" text-anchor="start" >25%</text>
<text x="362" y="308" font-size="16" fill="#b6c0d1" font-weight="400" text-anchor="end" >Building the technology itself</text>
<rect x="380" y="286" width="195" height="32" rx="4" fill="#1baf7a" opacity="0.55"/>
<text x="587.4285714285714" y="309" font-size="18" fill="#f1f5f9" font-weight="700" text-anchor="start" >9%</text>
<text x="64" y="356" font-size="14" fill="#7c889c" font-weight="400" text-anchor="start" >Takeaway: implementation and deployment roles are the biggest local opportunity; the Forward Deployed Engineer model fits best.</text>
